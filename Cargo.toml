[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
actuo-protocol = { path = "crates/protocol" }
actuo-core = { path = "crates/actuo-core" }
agent-client-protocol = "=2.2.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["fs", "process"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25"
serde_path_to_error = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v7"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned for the lane's checks of what it publishes to GitHub.
pulldown-cmark = { version = "=0.13.4", default-features = false }
regex = "=1.13.1"
# Pinned for the lane's `protected_paths` globs.
globset = { version = "=0.4.20", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# Releases: no symbol table (a crash backtrace shows addresses, not names) and
# thin LTO: a smaller binary at about the same build time.
[profile.release]
strip = true
lto = "thin"
